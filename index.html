<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartTouch</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .status {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .business {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .business h2 {
      margin-top: 0;
    }

    .business p {
      color: #555;
    }

    .tag {
      display: inline-block;
      background: #e5e7eb;
      padding: 6px 10px;
      border-radius: 20px;
      margin: 3px;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
    }

 
/* ================================
   SMARTTOUCH - DISEÑO PREMIUM
================================ */

.business.smarttouch-profile {
  position: relative;
  overflow: hidden;
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.12);
  border: 1px solid rgba(0,0,0,0.06);
}

/* ELEMENTOS GENERALES */

.smarttouch-category {
  display: inline-block;
  margin-bottom: 18px;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.smarttouch-profile h2 {
  margin: 8px 0;
  font-size: 30px;
}

.smarttouch-description {
  font-size: 16px;
  margin-bottom: 25px;
}

.smarttouch-actions {
  display: grid;
  gap: 12px;
}

.smarttouch-actions a {
  display: block;
  padding: 15px 18px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 700;
  transition: transform 0.2s ease;
}

.smarttouch-actions a:hover {
  transform: scale(1.02);
}


/* ================================
   BARBERÍA
================================ */

.business.smarttouch-profile.smarttouch-barberia {
  background: #1a1a1a !important;
  color: #ffffff !important;
}

.business.smarttouch-profile.smarttouch-barberia h2,
.business.smarttouch-profile.smarttouch-barberia p {
  color: #ffffff !important;
}

.business.smarttouch-profile.smarttouch-barberia .smarttouch-category {
  background: #c9a227 !important;
  color: #111111 !important;
}

.business.smarttouch-profile.smarttouch-barberia .smarttouch-actions a {
  background: #c9a227 !important;
  color: #111111 !important;
}


/* ================================
   GYM
================================ */

.business.smarttouch-profile.smarttouch-gym {
  background: linear-gradient(145deg, #101010, #292929) !important;
  color: #ffffff !important;
}

.business.smarttouch-profile.smarttouch-gym h2,
.business.smarttouch-profile.smarttouch-gym p {
  color: #ffffff !important;
}

.business.smarttouch-profile.smarttouch-gym .smarttouch-category {
  background: #e5e5e5 !important;
  color: #111111 !important;
}

.business.smarttouch-profile.smarttouch-gym .smarttouch-actions a {
  background: #e5e5e5 !important;
  color: #111111 !important;
}


/* ================================
   HOTEL
================================ */

.business.smarttouch-profile.smarttouch-hotel {
  background: linear-gradient(145deg, #f7f1e8, #ffffff) !important;
  color: #2b241d !important;
}

.business.smarttouch-profile.smarttouch-hotel h2,
.business.smarttouch-profile.smarttouch-hotel p {
  color: #2b241d !important;
}

.business.smarttouch-profile.smarttouch-hotel .smarttouch-category {
  background: #8a6a3b !important;
  color: #ffffff !important;
}

.business.smarttouch-profile.smarttouch-hotel .smarttouch-actions a {
  background: #8a6a3b !important;
  color: #ffffff !important;
}


/* ================================
   GASTRONOMÍA
================================ */

.business.smarttouch-profile.smarttouch-gastronomia {
  background: linear-gradient(145deg, #fff8ef, #ffffff) !important;
  color: #2b2118 !important;
}

.business.smarttouch-profile.smarttouch-gastronomia h2,
.business.smarttouch-profile.smarttouch-gastronomia p {
  color: #2b2118 !important;
}

.business.smarttouch-profile.smarttouch-gastronomia .smarttouch-category {
  background: #a44a2a !important;
  color: #ffffff !important;
}

.business.smarttouch-profile.smarttouch-gastronomia .smarttouch-actions a {
  background: #a44a2a !important;
  color: #ffffff !important;
} 
  </style>
</head>

<body>

  <header>
    <h1>SmartTouch</h1>
    <p>Encontrá comercios y servicios cerca tuyo</p>
  </header>

  <main class="container">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Buscar comercio..."
    >

    <div id="status" class="status">
      Cargando comercios...
    </div>

    <div id="businesses">
      <div class="loading">Cargando...</div>
    </div>

  </main>

  <script>

    // ==========================================
    // CONFIGURACIÓN SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://ojkucshtbdjfbypnoqil.supabase.co";

    const SUPABASE_KEY = "sb_publishable_rOq0IjRmFElzZTfvNZNPcg_DIbr__yS";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==========================================
    // VARIABLES
    // ==========================================

    let businesses = [];

    // ==========================================
// SMARTTOUCH ANALYTICS
// ==========================================

function getSessionId() {
  let sessionId = sessionStorage.getItem("smarttouch_session_id");

  if (!sessionId) {
    sessionId =
      "st_" +
      Date.now() +
      "_" +
      Math.random().toString(36).substring(2, 12);

    sessionStorage.setItem(
      "smarttouch_session_id",
      sessionId
    );
  }

  return sessionId;
}


function getDeviceType() {
  const width = window.innerWidth;

  if (width <= 767) {
    return "mobile";
  }

  if (width <= 1024) {
    return "tablet";
  }

  return "desktop";
}


async function trackAction(businessId, eventKey, tagId = null) {

  if (!businessId || !eventKey) {
    return;
  }

  try {

    const params = new URLSearchParams(window.location.search);

    // Si estamos entrando mediante un tag,
    // el origen oficial viene de la tabla tags.
    const tagSource = window.smartTouchSource;

    const sourceParam = params.get("source");

    const source =
      tagSource === "nfc" ||
      tagSource === "qr"
        ? tagSource
        : (
            sourceParam === "nfc" ||
            sourceParam === "qr" ||
            sourceParam === "web"
              ? sourceParam
              : null
          );

    const { error } = await supabaseClient
      .from("events")
      .insert({
        business_id: businessId,
        tag_id: tagId || window.smartTouchTagId || null,
        event_key: eventKey,
        source: source
      });

    if (error) {

      console.error(
        "SmartTouch Analytics Error:",
        error
      );

    } else {

      console.log(
        "SmartTouch Analytics:",
        eventKey,
        "Tag:",
        tagId || window.smartTouchTagId || null,
        "Source:",
        source
      );

    }

  } catch (error) {

    console.error(
      "SmartTouch Analytics Exception:",
      error
    );

  }
}
    // ==========================================
    // CARGAR COMERCIOS
    // ==========================================
async function loadBusinesses() {

  const container = document.getElementById("businesses");
  const status = document.getElementById("status");

  status.innerHTML = "🔄 Probando conexión con Supabase...";

  try {

    const { data, error } = await supabaseClient
      .from("businesses")
      .select("*")
      

    if (error) {
      throw error;
    }

    console.log("Respuesta Supabase:", data);

    businesses = data || [];
    
const params = new URLSearchParams(window.location.search);

const tagCode = params.get("tag");
const comercioSlug = params.get("comercio");

// ==========================================
// CARGAR COMERCIO DESDE TAG
// ==========================================
if (tagCode) {

  const openedFromTag = await openFromTag(tagCode);

  if (openedFromTag) {
    return;
  }
}
// ==========================================
// ABRIR COMERCIO DESDE TAG
// ==========================================
async function openFromTag(tagCode) {

  try {

    const { data: tag, error: tagError } =
      await supabaseClient
        .from("tags")
        .select("*")
        .eq("tag_code", tagCode)
        .eq("active", true)
        .single();

    if (tagError || !tag) {
      console.error("SmartTouch Tag Error:", tagError);
      return false;
    }

    window.smartTouchTagId = tag.id;
    window.smartTouchTagCode = tag.tag_code;
    window.smartTouchSource = tag.source;

    const { data: comercio, error: businessError } =
      await supabaseClient
        .from("businesses")
        .select("*")
        .eq("id", tag.business_id)
        .single();

    if (businessError || !comercio) {
      console.error(
        "SmartTouch Business Error:",
        businessError
      );
      return false;
    }

    console.log("SmartTouch Tag:", tag);
    console.log("SmartTouch Comercio:", comercio);
    console.log("SmartTouch Tag ID:", tag.id);
    console.log("SmartTouch Source:", tag.source);

    showBusiness(comercio.slug);

    return true;

  } catch (error) {

    console.error("SmartTouch Tag Exception:", error);

    return false;
  }
}
// ==========================================
// CARGAR COMERCIO DESDE SLUG
// ==========================================
if (comercioSlug) {

  const comercio = businesses.find(
    business => business.slug === comercioSlug
  );

  if (comercio) {
    showBusiness(comercio.slug);
    return;
  }
}
    status.innerHTML = `
      <strong>🟢 CONEXIÓN EXITOSA</strong>
      <br>
      Supabase respondió correctamente.
      <br>
      Comercios encontrados: ${businesses.length}
    `;

    renderBusinesses(businesses);

  } catch (error) {

    console.error("Error Supabase:", error);

    status.innerHTML = `
      <div class="error">
        <strong>🔴 ERROR DE CONEXIÓN</strong>
        <br><br>
        ${error.message}
      </div>
    `;

    container.innerHTML = "";

  }
}


    // ==========================================
    // MOSTRAR COMERCIOS
    // ==========================================

    function renderBusinesses(list) {

  const container = document.getElementById("businesses");

  if (!list.length) {
    container.innerHTML = `
      <div class="business">
        No encontramos comercios.
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(business => `
    <div class="business" 
         onclick="showBusiness('${business.slug}')"
         style="cursor:pointer;">

      <h2>${business.name || "Comercio sin nombre"}</h2>

      <p>${business.description || "Sin descripción"}</p>

      <p style="margin-top:15px;">
        👉 Ver comercio
      </p>

    </div>
  `).join("");

}

function showBusiness(slug) {
  const business = businesses.find(item => item.slug === slug);

  if (!business) {
    return;
  }
trackAction(
  business.id,
  "profile_view",
  window.smartTouchTagId || null
);
  const container = document.getElementById("businesses");

  const category = String(business.category || "comercio")
  .trim()
  .toLowerCase();

  const categoryNames = {
    barberia: "Barbería",
    gym: "Fitness & Gym",
    hotel: "Hotel",
    gastronomia: "Gastronomía",
    comercio: "Comercio"
  };

  const categoryName = categoryNames[category] || "Comercio";
  
  console.log("SMARTTOUCH:", business.name, "CATEGORY:", category);

  container.innerHTML = `
    <div class="business smarttouch-profile smarttouch-${category}">

      <span class="smarttouch-category">
        ${categoryName}
      </span>

      ${
        business.logo_url
          ? `
            <div style="margin-bottom:20px;">
              <img 
                src="${business.logo_url}"
                alt="${business.name || "Comercio"}"
                style="max-width:120px;border-radius:18px;"
              >
            </div>
          `
          : ""
      }

      <h2>
        ${business.name || "Comercio sin nombre"}
      </h2>

      <p class="smarttouch-description">
        ${business.description || "Sin descripción"}
      </p>

      <div class="smarttouch-actions">

        ${
          business.whatsapp
            ? `
              <a 
                href="https://wa.me/${String(business.whatsapp).replace(/\D/g, '')}"
                target="_blank"
                onclick="trackAction('${business.id}', 'whatsapp_click', window.smartTouchTagId || null)"
              >
                🟢 WhatsApp
              </a>
            `
            : ""
        }

        ${
          business.instagram
            ? `
              <a 
                href="${business.instagram}"
                target="_blank"
                onclick="trackAction('${business.id}', 'instagram_click', window.smartTouchTagId || null)"
              >
                📸 Instagram
              </a>
            `
            : ""
        }

        ${
          business.maps_url
            ? `
              <a 
                href="${business.maps_url}"
                target="_blank"
                onclick="trackAction('${business.id}', 'maps_click', window.smartTouchTagId || null)"
              >
                📍 Cómo llegar
              </a>
            `
            : ""
        }

        ${
          business.google_url
            ? `
              <a 
                href="${business.google_url}"
                target="_blank"
                onclick="trackAction('${business.id}', 'google_click', window.smartTouchTagId || null)"
              >
                ⭐ Dejanos tu opinión en Google
              </a>
            `
            : ""
        }

        ${
          business.payment_url
            ? `
              <a 
                href="${business.payment_url}"
                target="_blank"
                onclick="trackAction('${business.id}', 'payment_click', window.smartTouchTagId || null)"
              >
                💳 Pagar
              </a>
            `
            : ""
        }

      </div>

      <br>

      <button onclick="renderBusinesses(businesses)">
        ← Volver a comercios
      </button>

    </div>
  `;
}

    // ==========================================
    // BUSCADOR
    // ==========================================

    document
      .getElementById("search")
      .addEventListener("input", function() {

        const search = this.value.toLowerCase().trim();

        const filtered = businesses.filter(business => {

          const name =
            business.name?.toLowerCase() || "";

          const description =
            business.description?.toLowerCase() || "";

          const address =
            business.address?.toLowerCase() || "";

          return (
            name.includes(search) ||
            description.includes(search) ||
            address.includes(search)
          );

        });

        renderBusinesses(filtered);

      });


    // ==========================================
    // INICIAR
    // ==========================================

    loadBusinesses();

  </script>

</body>
</html>
